name: Build patched LobeHub canary

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'patches/**'

concurrency:
  group: patched-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/wzyu26/lobehub-canary-qq
    steps:
      - uses: actions/checkout@v7
        with:
          path: config
      - uses: actions/checkout@v7
        with:
          repository: lobehub/lobehub
          ref: canary
          path: source
          persist-credentials: false
      - name: Decide whether upstream needs a build
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha=$(git -C source rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=canary-${sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          previous=$(jq -r '.upstream // empty' config/last-build.json 2>/dev/null || true)
          if [[ "$EVENT_NAME" == schedule && "$previous" == "$sha" ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'No new upstream commit; keeping the existing image.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply pinned QQ fix and inject adapter test gate
        if: steps.source.outputs.needed == 'true'
        run: python3 config/scripts/prepare.py source
      - name: Set up Docker Buildx
        if: steps.source.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.source.outputs.needed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test and build candidate image
        if: steps.source.outputs.needed == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/Dockerfile.qq
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/wzyu26/lobehub-canary-qq
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            io.lobehub.qq-patch=18187-8d48bcdbd746aa036f0fde9f1ba934cc8ac26a14
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime and promote canary tag
        if: steps.source.outputs.needed == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --entrypoint /bin/node "$IMAGE@$DIGEST" -e "const fs=require('fs'); for(const p of ['/app/startServer.js','/app/server.js','/app/migrations']) if(!fs.existsSync(p)) throw new Error('Missing '+p); console.log('Runtime smoke check passed',process.version)"
          docker buildx imagetools create --tag "$IMAGE:canary" "$IMAGE@$DIGEST"
      - name: Record successful build
        if: steps.source.outputs.needed == 'true'
        working-directory: config
        env:
          UPSTREAM: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n --arg upstream "$UPSTREAM" --arg digest "$DIGEST" --arg image "$IMAGE:$IMAGE_TAG" --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{upstream:$upstream,digest:$digest,image:$image,run:$run}' > last-build.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-build.json
          git commit -m "Record tested canary image ${UPSTREAM:0:12} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          printf 'Published `%s:canary`\n\nPinned image: `%s@%s`\n\nUpstream: `%s`\n' "$IMAGE" "$IMAGE" "$DIGEST" "$UPSTREAM" >> "$GITHUB_STEP_SUMMARY"
