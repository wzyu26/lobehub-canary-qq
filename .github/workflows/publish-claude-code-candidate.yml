name: Publish fixed Claude Code candidate in the public package

on:
  workflow_dispatch:
  push:
    branches: [codex/claude-code-server-integration]
    paths: ['.github/workflows/publish-claude-code-candidate.yml']

concurrency:
  group: publish-claude-code-14d884799fcb90b56e7d3a73767f74bc98a9d42a
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'wzyu26/lobehub-canary-qq' && github.ref == 'refs/heads/codex/claude-code-server-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_REPOSITORY: wzyu26/lobehub-canary-qq
      SOURCE_RUN_ID: '40961595991'
      SOURCE_SHA: 14d884799fcb90b56e7d3a73767f74bc98a9d42a
      PUBLIC_IMAGE: ghcr.io/wzyu26/lobehub-canary-qq
      CLAUDE_CODE_VERSION: 2.1.301
    steps:
      - name: Require the exact source workflow to finish successfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_sha == $sha and .path == ".github/workflows/claude-code-candidate.yml"' source-run.json
          gh run watch "$SOURCE_RUN_ID" --repo "$SOURCE_REPOSITORY" --exit-status --interval 30
          gh api --method GET "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/claude-code-candidate.yml"' source-run.json

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin and verify both source images before copying either
        run: |
          set -euo pipefail
          printf 'Source CI: https://github.com/%s/actions/runs/%s\n\nSource commit: `%s`\n\n' \
            "$SOURCE_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          for component in worker admin; do
            source="ghcr.io/wzyu26/lobehub-claude-code-$component"
            digest=$(docker buildx imagetools inspect "$source:claude-code-$SOURCE_SHA" \
              --format '{{json .Manifest}}' | jq -er '.digest')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="$source@$digest"
            docker pull --platform linux/amd64 "$reference"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = 'linux/amd64'
            test "$(docker image inspect --format '{{.Config.User}}' "$reference")" = '10001:10001'
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference")" = "$SOURCE_SHA"
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true --entrypoint bun "$reference" \
              -e "if(process.getuid() !== 10001 || process.getgid() !== 10001) throw new Error('Unexpected runtime identity'); if(!require('fs').existsSync('/app/$component.js')) throw new Error('Missing bundle')"
            if [[ "$component" == worker ]]; then
              test "$(docker image inspect --format '{{index .Config.Labels "com.lobehub.claude-code.version"}}' "$reference")" = "$CLAUDE_CODE_VERSION"
              version=$(docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges:true --entrypoint /usr/local/bin/claude "$reference" --version)
              test "${version%% *}" = "$CLAUDE_CODE_VERSION"
              docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges:true --entrypoint bun "$reference" \
                --no-install /app/smokeWorkerStartup.mjs /app/worker.js
              printf 'Worker CLI version verified: `%s`.\n\n' "$version" >> "$GITHUB_STEP_SUMMARY"
            else
              help=$(docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges:true "$reference" --help)
              grep -Fq 'provision|enable|disable|status --user-id ID --worker-id ID' <<< "$help"
              printf 'Admin --help verified without database credentials.\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '%s_SOURCE_DIGEST=%s\n' "${component^^}" "$digest" >> "$GITHUB_ENV"
            printf 'Verified %s source: `%s` (linux/amd64, UID/GID 10001).\n\n' \
              "$component" "$reference" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Copy exact manifests and confirm anonymous pulls
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          for component in worker admin; do
            variable="${component^^}_SOURCE_DIGEST"
            source_digest="${!variable}"
            source="ghcr.io/wzyu26/lobehub-claude-code-$component@$source_digest"
            target="$PUBLIC_IMAGE:claude-code-$component-$SOURCE_SHA"
            docker buildx imagetools create --prefer-index=false --tag "$target" "$source"
            actual_digest=$(docker buildx imagetools inspect "$target" \
              --format '{{json .Manifest}}' | jq -er '.digest')
            test "$actual_digest" = "$source_digest"
            docker --config "$anonymous_config" pull --platform linux/amd64 "$PUBLIC_IMAGE@$actual_digest"
            printf 'Published %s: `%s`\n\nImmutable reference: `%s@%s`\n\nAnonymous pull verified.\n\n' \
              "$component" "$target" "$PUBLIC_IMAGE" "$actual_digest" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'Only the two fixed candidate tags were copied. The existing app candidate and canary tags were not changed.\n' >> "$GITHUB_STEP_SUMMARY"
