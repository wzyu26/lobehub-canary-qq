name: Validate and build opt-in Claude Code candidate

on:
  workflow_dispatch:
  push:
    branches: [codex/claude-code-server-integration]
    paths:
      - '.github/workflows/claude-code-candidate.yml'
      - 'claude-code-baseline.json'
      - 'scripts/prepare-claude-code.py'
      - 'scripts/smoke-claude-code-app.mjs'
      - 'patches/claude-code-server.patch'

concurrency:
  group: claude-code-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: config
      - uses: actions/checkout@v7
        with:
          repository: lobehub/lobehub
          ref: 528ffe89cfe882ac30ec6699e3c46004362985cb
          path: source
          persist-credentials: false
      - run: python3 config/scripts/prepare-claude-code.py source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the pinned source workspace
        working-directory: source
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm install --no-frozen-lockfile
      - name: Worker and shared CLI/MCP checks
        working-directory: source/apps/claude-code-worker
        run: |
          pnpm exec vitest run
          bun run build
      - name: Type check and server integration checks
        working-directory: source
        run: |
          pnpm exec tsgo --noEmit -p tsconfig.type-check.json
          pnpm exec vitest run apps/server/src/services/claudeCode apps/server/src/router-hono/claude-code apps/server/src/globalConfig/__tests__/claudeCodeCatalog.integration.test.ts apps/server/src/services/agentRuntime/__tests__/StaleOperationReaper.test.ts apps/server/src/services/agentRuntime/AgentRuntimeService/__tests__/interrupt.test.ts
      - name: Ordinary assistant routing and model entry
        working-directory: source
        run: pnpm exec vitest run src/store/chat/slices/agentRun/actions/__tests__/claudeCodeRouting.test.ts src/store/chat/slices/agentRun/actions/dispatch/resolveAssistantTransport.test.ts src/hooks/claudeCodeModels.test.ts src/hooks/useClaudeCodeModels.test.ts apps/server/src/services/aiAgent/pipeline/turnSetup.claudeCode.test.ts apps/server/src/services/agentRuntime/CompletionLifecycle/index.backgroundDb.test.ts
      - name: Atomic stream delivery on an isolated Redis
        working-directory: source
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pnpm exec vitest run apps/server/src/modules/AgentRuntime/publishStreamEventOnce.test.ts apps/server/src/modules/AgentRuntime/__tests__/publishStreamEventOnce.redis.integration.test.ts
      - name: Gateway event deduplication
        working-directory: source/packages/agent-gateway-client
        run: pnpm exec vitest run src/durableEventGuard.test.ts src/client.test.ts src/mux/GatewayMuxClient.test.ts
      - name: Shared MCP and launcher regression
        working-directory: source/packages/heterogeneous-agents
        run: pnpm exec vitest run src/spawn src/builtinMcp/LobeBuiltinMcpServer.operationTools.test.ts
      - name: Persistent state and isolation
        working-directory: source/packages/database
        run: pnpm exec vitest run src/models/__tests__/claudeCode.test.ts
      - name: Preserve QQ behavior
        working-directory: source/packages/chat-adapter-qq
        run: pnpm exec vitest run --config vitest.config.mts src/adapter.test.ts src/passive-reply.test.ts

  image:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            file: Dockerfile.qq
            image: ghcr.io/wzyu26/lobehub-canary-qq
          - component: worker
            file: apps/claude-code-worker/Dockerfile
            image: ghcr.io/wzyu26/lobehub-claude-code-worker
          - component: admin
            file: apps/claude-code-worker/Dockerfile
            image: ghcr.io/wzyu26/lobehub-claude-code-admin
            target: admin
    steps:
      - uses: actions/checkout@v7
        with:
          path: config
      - uses: actions/checkout@v7
        with:
          repository: lobehub/lobehub
          ref: 528ffe89cfe882ac30ec6699e3c46004362985cb
          path: source
          persist-credentials: false
      - run: python3 config/scripts/prepare-claude-code.py source
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: source
          file: source/${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:claude-code-${{ github.sha }}
          build-args: |
            LOBEHUB_BUILD_REVISION=${{ github.sha }}
            CLAUDE_CODE_VERSION=2.1.301
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.lobehub.upstream=528ffe89cfe882ac30ec6699e3c46004362985cb
            io.lobehub.qq-patch=18187-8d48bcdbd746aa036f0fde9f1ba934cc8ac26a14
          cache-from: type=gha,scope=claude-code-${{ matrix.component }}
          cache-to: type=gha,scope=claude-code-${{ matrix.component }},mode=max,ignore-error=true
      - name: Verify the published runtime
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          case "$COMPONENT" in
            app)
              docker run --rm --entrypoint /bin/node "$IMAGE@$DIGEST" -e "const fs=require('fs'); for(const p of ['/app/startServer.js','/app/server.js','/app/migrations']) if(!fs.existsSync(p)) throw new Error('Missing '+p)"
              container_id=''
              trap 'if [[ -n "$container_id" ]]; then docker rm -f "$container_id" >/dev/null 2>&1 || true; fi' EXIT
              # VERCEL_ENV skips background DB recovery/gateway startup only.
              # The standalone server and public catalog still run in production mode.
              container_id=$(docker create --network none --entrypoint /bin/node \
                --cap-drop ALL --security-opt no-new-privileges:true \
                --env NODE_ENV=production --env VERCEL_ENV=preview \
                --env HOSTNAME=127.0.0.1 --env PORT=3210 \
                --env APP_URL=http://127.0.0.1:3210 \
                --env S3_ENDPOINT=http://127.0.0.1:1 \
                --env DATABASE_DRIVER=node --env DATABASE_URL=postgres://ci:ci@127.0.0.1:1/ci \
                --env DATABASE_STATEMENT_TIMEOUT=1000 \
                --env KEY_VAULTS_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
                --env AUTH_SECRET=ci-only-runtime-auth-secret-00000000000000000000000000000000 \
                --env AUTH_SSO_PROVIDERS= --env JWKS_KEY= --env REDIS_URL= \
                --env VERCEL_EDGE_CONFIG= --env ENABLE_TELEMETRY= \
                --env NEXT_TELEMETRY_DISABLED=1 --env CLAUDE_CODE_SERVER_ENABLED=0 \
                "$IMAGE@$DIGEST" /app/server.js)
              docker cp config/scripts/smoke-claude-code-app.mjs "$container_id:/app/smoke-claude-code-app.mjs"
              docker start "$container_id" >/dev/null
              docker exec "$container_id" /bin/node /app/smoke-claude-code-app.mjs
              ;;
            worker)
              docker run --rm --network none --entrypoint /usr/local/bin/claude "$IMAGE@$DIGEST" --version
              docker run --rm --network none --entrypoint bun "$IMAGE@$DIGEST" /app/smokeWorkerStartup.mjs /app/worker.js
              ;;
            admin)
              docker run --rm "$IMAGE@$DIGEST" --help
              ;;
          esac
      - name: Record immutable candidate only
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Candidate: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'No production tag was promoted and no server was deployed.' >> "$GITHUB_STEP_SUMMARY"
